spring:
  application:
    name: pg-management
  
  # Use H2 for free tier (replace with Cloud SQL for production)
  datasource:
    url: jdbc:h2:mem:pgdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # Disable Kafka for free tier (use Cloud Pub/Sub in production)
  kafka:
    enabled: false
  
  # Disable Redis for free tier (use Memorystore in production)
  redis:
    enabled: false

server:
  port: ${PORT:8080}

# AWS disabled for free tier
aws:
  enabled: false

jwt:
  secret: ${JWT_SECRET:pg-management-secret-key-2024}
  expiration: 86400000
